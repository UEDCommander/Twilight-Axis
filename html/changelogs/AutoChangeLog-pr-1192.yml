author: "Vladmar11"
delete-after: True
changes:
  - bugfix: "Исправлена выдача опыта за попадание собственным рикошетом из пращи по себе."
  - bugfix: "Исправлен дюп зубила и молотка."
  - bugfix: "Исправлен дюп поясов для тяжёлого оружия."
  - bugfix: "Исправлено применение выборов виртуе Well Off/Notable, из-за чего Beauty могла не выдаваться вместе с Residency."
  - bugfix: "Исправлено превращение hwang scabbard в simple strap при магической починке."
  - bugfix: "Исправлено некорректное наложение штрафа брони и дерганность маунтов при движении."
  - bugfix: "Исправлена выдача виртуе, лодаута и дополнительных языков милитанту-дезертиру."
  - bugfix: "Исправлена возможность навсегда застрять внутри раскладного стола при его складывании."
  - bugfix: "Активное оружие мученика больше нельзя спрятать в пояс или strap для тяжёлого оружия во время действия клятвы."
  - bugfix: "Cloth military skirt, faulds и их аналоги теперь можно чинить пошивом."
  - bugfix: "Исправлен дюп угля через печи."
  - bugfix: "Временный источник света от заклинаний теперь корректно удаляется при досрочном прерывании каста."
  - bugfix: "Исправлено завышение статов после снятия зомби-антага."
  - bugfix: "Убрана возможность ставить рипост или делать спешиал когда ты мертв/парализован"
  - bugfix: "Убран вывод сообщений о том, что персонаж что то осматривает, когда он мертв."
  - bugfix: "Фикс исчезновения вещей из капюшона"
  - bugfix: "Исправлен бесконечный звук смеша у цепов"
  - bugfix: "Исправлена возможность сделать рывок с Caedo в дерево"
  - bugfix: "Исправлен баг у скелетов вретчей с глухотой у ревенантов, когда те заходили за эти роли"